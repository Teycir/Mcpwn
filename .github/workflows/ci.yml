name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Unit and integration tests
        run: python -m pytest tests_unit -q --cov=. --cov-report=term-missing

      - name: Flake8
        run: |
          python -m flake8 core tests tests_unit mcpwn.py payloads.py \
            test_data/mcp_test_server.py

      - name: Bandit
        run: python -m bandit -r core mcpwn.py payloads.py -ll

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Non-destructive end-to-end scan
        run: |
          python mcpwn.py --safe-mode --output-json report.json \
            --output-sarif report.sarif \
            python test_data/dvmcp_server.py
          python -c 'import json; r=json.load(open("report.json")); t=r["summary"]["by_type"]; assert "RCE" in t, t; assert "TOOL_PATH_TRAVERSAL" in t, t; assert r["summary"]["verified"] >= 2; print("verified findings:", r["summary"]["verified"])'
